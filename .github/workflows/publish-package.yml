name: Publish Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and optionally publish
        required: false
        default: main
      publish_package:
        description: Publish package after building and verifying it
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-package-${{ github.event.release.tag_name || github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Verify pushed tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          TAG_NAME="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "release tag $TAG_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Verify manual publish ref version
        if: github.event_name == 'workflow_dispatch'
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "manual publish for ref '${{ github.event.inputs.ref }}' with package version ${PKG_VERSION}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify and build package
        run: |
          bun run typecheck
          bun run build

      - name: Verify log store
        run: bun ./scripts/verify/store.mjs

      - name: Verify packed release contents
        run: bun run verify:pack

      - name: Publish package
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_package == 'true')
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public
